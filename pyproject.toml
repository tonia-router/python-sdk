[project]
name = "tonia"
version = "0.3.0"
description = "Official Python client for tonia Pass, including speech and transcription"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "tonia inc." }]
urls = { Homepage = "https://tonia.ca", Repository = "https://github.com/tonia-router/python-sdk" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "setuptools>=68"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tonia = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Prefer this package's src/ over any other installed `tonia` (e.g. Pass API editable).
pythonpath = ["src"]
