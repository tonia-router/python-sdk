[project]
name = "tonia"
version = "0.1.0"
description = "Official Python client for tonia Pass"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "tonia" }]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "setuptools>=68"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
