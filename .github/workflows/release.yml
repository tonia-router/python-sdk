name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > /tmp/notes.md <<EOF
          Official Python client for tonia Pass (\`tonia\`).

          Install from PyPI after registry publish: \`pip install tonia\`

          From this release:

              pip install https://github.com/tonia-router/python-sdk/releases/download/${TAG}/tonia-0.2.1-py3-none-any.whl

          Requires Python 3.11+. Apache 2.0, copyright 2026 tonia inc.
          EOF
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md dist/*
